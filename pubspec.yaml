name: store_app
description: "A new Flutter project."
 
publish_to: 'none'  

 
version: 1.0.0+1

environment:
  sdk: ^3.11.4

 
dependencies:
  flutter:
    sdk: flutter

 
  cupertino_icons: ^1.0.8

  # --- State Management ---
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0

  # --- Functional programming for error handling (Either<Failure, T>) ---
  dartz: ^0.10.1

  # --- Networking ---
  dio: ^5.10.0

  # --- Local storage (session / token) ---
  shared_preferences: ^2.5.5

  # --- Navigation ---
  go_router: ^18.0.2

  # --- Cached remote images for product cards ---
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^10.0.0

 
  flutter_lints: ^6.0.0

 
flutter:

 
  uses-material-design: true

  assets:
    - assets/images/
 